<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Fond arrondi style app icon -->
  <rect width="400" height="400" rx="90" ry="90" fill="#0D1117"/>
  <!-- Bordure subtile -->
  <rect width="400" height="400" rx="90" ry="90" fill="none" stroke="#21262D" stroke-width="3"/>

  <!-- Scan lines très subtiles -->
  <line x1="0" y1="160" x2="400" y2="160" stroke="#3FB950" stroke-width="1" opacity="0.04"/>
  <line x1="0" y1="200" x2="400" y2="200" stroke="#3FB950" stroke-width="1" opacity="0.06"/>
  <line x1="0" y1="240" x2="400" y2="240" stroke="#3FB950" stroke-width="1" opacity="0.04"/>

  <!-- Monogramme CHD centré -->
  <polyline points="230,110 80,110 80,290 230,290"
    fill="none" stroke="#3FB950" stroke-width="26"
    stroke-linecap="butt" stroke-linejoin="miter"/>

  <line x1="250" y1="110" x2="250" y2="290"
    stroke="#3FB950" stroke-width="26" stroke-linecap="butt"/>

  <line x1="230" y1="200" x2="275" y2="200"
    stroke="#3FB950" stroke-width="22" stroke-linecap="butt"/>

  <path d="M272 110 Q370 110 370 200 Q370 290 272 290"
    fill="none" stroke="#3FB950" stroke-width="26"
    stroke-linecap="butt"/>

  <!-- Curseur terminal -->
  <rect x="300" y="258" width="46" height="32" fill="#3FB950"/>
</svg>
